# =============================================================================
# Configuration for the periodic-image self-interaction check.
#
# This ONE file is read by both scripts:
#   run_mindist_pi.sh        -- generates one mindist_pi.xvg per run below
#   check_periodic_image.py  -- reads those files and reports the result
#
# Syntax is plain shell KEY="value" (the bash script sources this file; the
# python script parses the same syntax). Lists are space-separated. Lines that
# start with # are ignored. Edit the values, save, then run the two scripts.
# =============================================================================


# -- Which simulations to check -----------------------------------------------
#
# List one run directory per line inside RUNS. Each directory must contain the
# trajectory + topology files named further down. An optional SECOND word on a
# line is a group label, used only to pool related runs together in the output
# (e.g. the three replicas of one system). If you omit the label, the folder's
# own name is used.
#
# This is layout-agnostic: one simulation or many, with replicas or without,
# just list the directories. Examples (replace with your own):
#
#   /data/native/1      native
#   /data/native/2      native
#   /data/native/3      native
#   /data/mutant/1      mutant
#   /data/one_off_run
#
RUNS="
"


# -- Optional shortcut for a BASE/<replica>/<system> layout -------------------
#
# Only used when RUNS above is empty. Expands to one run per REPLICA x SYSTEM,
# located at BASE/<replica>/<system>, with the system name as the group label.
# Leave BASE empty to disable this shortcut.
BASE=""
REPLICAS=""      # e.g. "1 2 3"
SYSTEMS=""       # e.g. "native mutant"


# -- File names expected inside each run directory ----------------------------
XTC_NAME="prd.xtc"      # trajectory
TPR_NAME="prd.tpr"      # run input / topology (also supplies default groups)
NDX_NAME=""             # index file. Leave EMPTY to use gmx's default groups
                        # (fine when GROUP below is a standard group such as
                        # "Protein"). Set a filename only if GROUP is custom.


# -- What to measure ----------------------------------------------------------
GROUP="Protein"         # atom group whose periodic images are checked
CUTOFF_NM="1.0"         # "interacting" means an image approaches closer than
                        # this distance (nm). A sensible value is your MD
                        # nonbonded cutoff, since interactions vanish beyond it.
                        # Read by check_periodic_image.py; override at run time
                        # with its --cutoff flag.


# -- Output name --------------------------------------------------------------
OUTNAME="mindist_pi.xvg"   # gmx mindist output, written inside each run dir

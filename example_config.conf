# Minimal example config. Copy to config.conf (or pass this file as an argument)
# and edit the paths. See config.conf for the fully commented template.

# One run directory per line; optional second word is a group label used to
# pool related runs (e.g. replicas) in the output.
RUNS="
/path/to/run_a          system1
/path/to/run_b/rep1     system2
/path/to/run_b/rep2     system2
"

XTC_NAME="prd.xtc"          # trajectory file name inside each run directory
TPR_NAME="prd.tpr"          # run input / topology
NDX_NAME=""                 # leave empty when GROUP is a default group

GROUP="Protein"             # group whose periodic images are checked
CUTOFF_NM="1.0"             # "interacting" = image approaches closer than this

OUTNAME="mindist_pi.xvg"    # per-run output written inside each run directory
